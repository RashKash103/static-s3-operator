{{/*
The operator's default S3 credentials.

This Secret is only rendered when operator.credentials.create is true, which puts
the access key in a values file. That is convenient for a first install and for
CI, and it is the wrong place for a production credential: prefer
operator.credentials.existingSecret and manage the Secret with whatever your
cluster already uses for secrets.
*/}}
{{- $credentials := (.Values.operator | default dict).credentials | default dict }}
{{- if $credentials.create }}
{{- if $credentials.existingSecret }}
{{- fail "operator.credentials: set either create or existingSecret, not both" }}
{{- end }}
{{- if not $credentials.accessKeyID }}
{{- fail "operator.credentials.accessKeyID is required when operator.credentials.create is true" }}
{{- end }}
{{- if not $credentials.secretAccessKey }}
{{- fail "operator.credentials.secretAccessKey is required when operator.credentials.create is true" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "static-s3-operator.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "static-s3-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
type: Opaque
stringData:
  {{ $credentials.accessKeyIDKey | default "accessKeyID" }}: {{ $credentials.accessKeyID | quote }}
  {{ $credentials.secretAccessKeyKey | default "secretAccessKey" }}: {{ $credentials.secretAccessKey | quote }}
  {{- with $credentials.sessionToken }}
  {{ $credentials.sessionTokenKey | default "sessionToken" }}: {{ . | quote }}
  {{- end }}
{{- end }}
