{{- /*
Binds the metrics-reader ClusterRole to whoever scrapes the metrics endpoint.

With metrics.secure the endpoint is behind authn/authz, so a scraper presenting
its ServiceAccount token is authorized through a SubjectAccessReview. The chart
shipped the ClusterRole but bound it to nothing, so scrapes came back 403 -- a
failure that looks like a TLS or ServiceMonitor problem and is neither. The chart
cannot guess which ServiceAccount Prometheus runs as, hence a list rather than a
default.

metrics-auth-role is a different thing and stays bound to the operator: that one
lets the operator *perform* the TokenReview and SubjectAccessReview.
*/ -}}
{{- if and .Values.metrics.enabled .Values.metrics.secure .Values.metrics.readers }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "static-s3-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "static-s3-operator.resourceName" (dict "suffix" "metrics-reader-binding" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "static-s3-operator.resourceName" (dict "suffix" "metrics-reader" "context" $) }}
subjects:
  {{- range .Values.metrics.readers }}
  - kind: ServiceAccount
    name: {{ .name }}
    namespace: {{ required "metrics.readers[].namespace is required: a ServiceAccount subject in a ClusterRoleBinding must name its namespace" .namespace }}
  {{- end }}
{{- end }}
