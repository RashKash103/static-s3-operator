name: Generated Files

on:
  # branches, not bare "push": a pull request from a branch in this repository
  # fires both push and pull_request, which ran every check twice. Limiting push
  # to main leaves one run per pull request and one per merge -- and stops a tag
  # push from running CI at all, which the release workflow handles.
  push:
    branches: [main]
  pull_request:

# A newer push makes the previous answer irrelevant.
concurrency:
  group: verify-generated-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # CRDs, RBAC, deepcopy, the standalone JSON Schemas and the single-file
      # installer are all derived from the code. A stale one is a lie that only
      # shows up when somebody installs from it.
      # The target checks go.mod too, so a local `make verify-generated` catches
      # everything this job would.
      - name: Regenerate and compare
        run: make verify-generated
