name: Generated Files

on:
  push:
  pull_request:

# A newer push makes the previous answer irrelevant.
concurrency:
  group: verify-generated-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # CRDs, RBAC, deepcopy, the standalone JSON Schemas and the single-file
      # installer are all derived from the code. A stale one is a lie that only
      # shows up when somebody installs from it.
      - name: Regenerate and compare
        run: make verify-generated

      - name: Check that go.mod is tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit the result."
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi
