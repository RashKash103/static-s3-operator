name: Test Chart

on:
  # branches, not bare "push": a pull request from a branch in this repository
  # fires both push and pull_request, which ran every check twice. Limiting push
  # to main leaves one run per pull request and one per merge -- and stops a tag
  # push from running CI at all, which the release workflow handles.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-chart-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare static-s3-operator
        run: |
          go mod tidy
          make docker-build
          kind load docker-image $IMG

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: |
          helm lint ./dist/chart

      - name: Check that values.schema.json is enforced
        # helm lint only applies the schema to the values it is given, so an
        # explicitly invalid value is what proves the schema is doing its job.
        run: |
          if helm template static-s3-operator ./dist/chart \
              --set operator.defaults.sourcePath=not-absolute >/dev/null 2>&1; then
            echo "::error::values.schema.json did not reject a relative sourcePath"
            exit 1
          fi
          if helm template static-s3-operator ./dist/chart \
              --set operator.credentials.create=true >/dev/null 2>&1; then
            echo "::error::values.schema.json did not reject create without an access key"
            exit 1
          fi
          echo "values.schema.json rejects invalid values as expected."

# TODO: Uncomment if cert-manager is enabled
#      - name: Install cert-manager via Helm (wait for readiness)
#        run: |
#          helm repo add jetstack https://charts.jetstack.io
#          helm repo update
#          helm install cert-manager jetstack/cert-manager \
#            --namespace cert-manager \
#            --create-namespace \
#            --set crds.enabled=true \
#            --wait \
#            --timeout 300s

# TODO: Uncomment if Prometheus is enabled
#      - name: Install Prometheus Operator CRDs
#        run: |
#          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#          helm repo update
#          helm install prometheus-crds prometheus-community/prometheus-operator-crds

      - name: Deploy manager via Helm
        # Credentials come from a Secret the user manages, which is the documented
        # path; the operator reads them per site rather than at startup, so no S3
        # server is needed for this smoke test.
        run: |
          kubectl create namespace static-s3-operator-system
          kubectl create secret generic s3-credentials \
            --namespace static-s3-operator-system \
            --from-literal=accessKeyID=smoke-test \
            --from-literal=secretAccessKey=smoke-test
          make helm-deploy HELM_EXTRA_ARGS="--set operator.credentials.existingSecret=s3-credentials --set metrics.enabled=false"

      - name: Check Helm release status
        run: |
          make helm-status

      - name: Confirm the manager started and read its configuration
        run: |
          kubectl -n static-s3-operator-system rollout status \
            deployment/static-s3-operator-controller-manager --timeout=3m
          # The manager logs its resolved settings at startup, including the syncer
          # image it discovered from its own Pod. Missing that line means it failed
          # its configuration check.
          kubectl -n static-s3-operator-system logs \
            deployment/static-s3-operator-controller-manager --tail=200 \
            | tee /tmp/manager.log
          grep -q "Resolved operator configuration" /tmp/manager.log

      - name: Confirm the CRD the chart ships accepts every example
        # The chart carries its own copy of the CRD. When it lags the API, the
        # operator is correct and installing the chart still rejects valid
        # manifests, so the examples are checked against the chart's copy and not
        # only against config/crd/bases.
        run: |
          kubectl get crd staticsites.web.rka.sh
          # The examples name their own namespaces, so those have to exist for a
          # server-side dry run to get as far as validating the resources.
          kubectl create namespace web
          for example in examples/*.yaml; do
            echo "::group::$example"
            kubectl apply -f "$example" --dry-run=server
            echo "::endgroup::"
          done
          kubectl explain staticsite.spec.source --recursive | head -20
