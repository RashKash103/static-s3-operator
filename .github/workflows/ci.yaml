name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep every job on the toolchain go.mod asks for, rather than whichever
  # version the runner image happens to ship.
  GO_VERSION_FILE: go.mod

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Verify the linter configuration
        run: make lint-config

      - name: Lint
        run: make lint

  generated:
    name: Generated files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Regenerate everything derived from the code
        run: make verify-generated

  unit:
    name: Unit and controller tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # These run the reconciler against a real API server via envtest, so they
      # cover finalizers, Job handling and status without needing a cluster.
      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  integration:
    name: S3 integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # A real S3 API, because what these tests check is how a provider behaves:
      # which optional calls it implements and how it rewrites a bucket policy.
      # The Makefile target starts and stops the server itself.
      - name: Test against a local S3 server
        run: make test-integration

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Lint and render the chart
        run: make helm-lint

      - name: Validate the values schema against the default values
        # `helm lint` only applies values.schema.json to the values it is given,
        # so an explicitly invalid value proves the schema is actually enforced.
        run: |
          if helm template static-s3-operator dist/chart \
              --set operator.defaults.sourcePath=not-absolute >/dev/null 2>&1; then
            echo "::error::values.schema.json did not reject a relative sourcePath"
            exit 1
          fi
          echo "values.schema.json rejects invalid values as expected."

  build:
    name: Build the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # Build only: publishing happens in release.yaml. This catches a Dockerfile
      # that no longer builds without waiting for a tag.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # The full loop takes minutes: it builds the image, starts an object store and
    # a registry in a Kind cluster, publishes a generated sample site and fetches
    # the result over HTTP.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Create a Kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.31.0
          cluster_name: static-s3-operator-test-e2e

      - name: Run the end-to-end tests
        env:
          KIND_CLUSTER: static-s3-operator-test-e2e
        # The suite creates its own cluster if one is missing; here it reuses the
        # one above, so cleanup is left to the runner.
        run: go test -tags=e2e ./test/e2e/ -v -ginkgo.v -timeout 40m

      - name: Describe the cluster on failure
        if: failure()
        run: |
          kubectl get staticsites -A -o yaml || true
          kubectl get jobs,pods,services -A || true
          kubectl -n static-s3-operator-system logs deployment/static-s3-operator-controller-manager \
            --tail=500 --all-containers || true
          kubectl -n static-s3-e2e describe pods || true
