name: E2E Tests

on:
  # branches, not bare "push": a pull request from a branch in this repository
  # fires both push and pull_request, which ran every check twice. Limiting push
  # to main leaves one run per pull request and one per merge -- and stops a tag
  # push from running CI at all, which the release workflow handles.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    # The suite builds the operator image, deploys an object store and a container
    # registry into a Kind cluster, publishes a generated sample site through the
    # chart-installed operator, and fetches the result over HTTP.
    timeout-minutes: 45
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # The suite installs the operator through the chart, which is the path users
      # follow, so Helm has to be present before it runs.
      - name: Install Helm
        run: make install-helm

      - name: Running Test e2e
        run: make test-e2e

      # A failed end-to-end run is only useful if you can see why.
      - name: Describe the cluster on failure
        if: failure()
        run: |
          kubectl get staticsites -A -o yaml || true
          kubectl get jobs,pods,services -A || true
          kubectl -n static-s3-e2e describe pods || true
          kubectl -n static-s3-operator-system logs \
            deployment/static-s3-operator-controller-manager \
            --tail=500 --all-containers || true
