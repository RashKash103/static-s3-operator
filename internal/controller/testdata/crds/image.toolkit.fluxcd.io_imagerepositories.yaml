# A stand-in for Flux's ImageRepository CRD, so the relay can be tested against a
# real API server without vendoring Flux. It declares only what the relay reads,
# spec.image, and preserves everything else; the relay never depends on the rest.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: imagerepositories.image.toolkit.fluxcd.io
spec:
  group: image.toolkit.fluxcd.io
  names:
    kind: ImageRepository
    listKind: ImageRepositoryList
    plural: imagerepositories
    singular: imagerepository
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                image:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
