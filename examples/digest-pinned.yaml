# A site pinned to an exact image digest, for GitOps.
#
# Nothing changes until the digest in this file changes, so your deployment tool
# decides when the site is republished, and a rollback is reverting a commit.
#
# A digest reference is also never resolved against the registry, so the operator
# needs no pull credentials for this site even if the image is private -- the sync
# Job still needs to pull it, so spec.source.imagePullSecrets may still apply.
# yaml-language-server: $schema=https://raw.githubusercontent.com/rashkash103/static-s3-operator/main/dist/schemas/staticsite-v1alpha1.json
apiVersion: web.rka.sh/v1alpha1
kind: StaticSite
metadata:
  name: docs
  namespace: web
  annotations:
    # Your pipeline rewrites the digest below and commits. This annotation is a
    # reminder of which build it came from; the operator ignores it.
    acme.example.com/build: "2026-08-09T12:00:00Z"
spec:
  source:
    image: ghcr.io/acme/docs@sha256:5f8c0a0e5a7a1c8b5b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f607182
    # Polling is meaningless for a digest and is ignored, but stating it makes the
    # intent obvious to the next reader.
    pullInterval: "0"

  bucket:
    name: acme-docs
    website:
      indexDocument: index.html
      errorDocument: 404.html

  sync:
    deleteRemoved: true
    cacheControl:
      - pattern: "assets/**"
        value: "public, max-age=31536000, immutable"
      - pattern: "**/*.html"
        value: "public, max-age=0, must-revalidate"
